<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | AuthFlow</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #e5e7eb;
            min-height: 100vh;
        }

        .navbar {
            background-color: #0f2747;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-links a {
            text-decoration: none;
            padding: 9px 16px;
            border-radius: 6px;
            font-weight: bold;
        }

        .home-btn {
            color: white;
        }

        .home-btn:hover {
            background-color: #193b68;
        }

        .profile-btn {
            color: white;
        }

        .profile-btn:hover {
            background-color: #193b68;
        }

        .logout-btn {
            background-color: white;
            color: #0f2747;
        }

        .logout-btn:hover {
            background-color: #d1d5db;
        }

        .container {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .password-card {
            width: 430px;
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .password-card h1 {
            color: #0f2747;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            text-align: center;
            margin-bottom: 25px;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }

        .message.error {
            background-color: #e5e7eb;
            color: #991b1b;
            border: 1px solid #9ca3af;
        }

        .message.success {
            background-color: #e5e7eb;
            color: #0f2747;
            border: 1px solid #0f2747;
        }

        label {
            display: block;
            color: #374151;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            border: 1px solid #9ca3af;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: #0f2747;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0f2747;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #193b68;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="brand">
            AuthFlow
        </div>

        <div class="nav-links">

            <a href="{% url 'home' %}" class="home-btn">
                Home
            </a>

            <a href="{% url 'profile' %}" class="profile-btn">
                Profile
            </a>

            <a href="{% url 'logout' %}" class="logout-btn">
                Logout
            </a>

        </div>

    </nav>

    <div class="container">

        <div class="password-card">

            <h1>Change Password</h1>

            <p class="subtitle">
                Update your account password
            </p>

            {% if messages %}
                {% for message in messages %}
                    <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <label>Current Password</label>

                <input
                    type="password"
                    name="current_password"
                    placeholder="Enter your current password"
                    required
                >

                <label>New Password</label>

                <input
                    type="password"
                    name="new_password"
                    placeholder="Enter your new password"
                    required
                >

                <label>Confirm New Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your new password"
                    required
                >

                <button type="submit">
                    Change Password
                </button>

            </form>

        </div>

    </div>

</body>
</html>
