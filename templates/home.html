<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home | AuthFlow</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #e5e7eb;
            min-height: 100vh;
        }

        .navbar {
            background-color: #0f2747;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-links a {
            text-decoration: none;
            padding: 9px 16px;
            border-radius: 6px;
            font-weight: bold;
        }

        .profile-btn {
            color: white;
        }

        .profile-btn:hover {
            background-color: #193b68;
        }

        .logout-btn {
            background-color: white;
            color: #0f2747;
        }

        .logout-btn:hover {
            background-color: #d1d5db;
        }

        .container {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .home-card {
            width: 450px;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .home-card h1 {
            color: #0f2747;
            margin-bottom: 12px;
        }

        .home-card p {
            color: #6b7280;
            line-height: 1.6;
        }

        .username {
            color: #0f2747;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="brand">
            AuthFlow
        </div>

        <div class="nav-links">

            <a href="{% url 'profile' %}" class="profile-btn">
                Profile
            </a>

            <a href="{% url 'logout' %}" class="logout-btn">
                Logout
            </a>

        </div>

    </nav>

    <div class="container">

        <div class="home-card">

            <h1>
                Welcome,
                <span class="username">
                    {{ request.user.username }}
                </span>
            </h1>

            <p>
                You have successfully logged in to AuthFlow.
            </p>

        </div>

    </div>

</body>
</html>
