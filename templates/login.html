<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AuthFlow</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 380px;
            background-color: #ffffff;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .login-card h1 {
            color: #0f2747;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            text-align: center;
            margin-bottom: 25px;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }

        .message.error {
            background-color: #e5e7eb;
            color: #991b1b;
            border: 1px solid #9ca3af;
        }

        .message.success {
            background-color: #e5e7eb;
            color: #0f2747;
            border: 1px solid #0f2747;
        }

        label {
            display: block;
            color: #374151;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            border: 1px solid #9ca3af;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: #0f2747;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0f2747;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #193b68;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
        }

        .signup-link a {
            color: #0f2747;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <h1>AuthFlow</h1>
        <p class="subtitle">Login to your account</p>

        {% if messages %}
            {% for message in messages %}
                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="signup-link">
            Don't have an account?
            <a href="{% url 'signup' %}">Create Account</a>
        </p>

    </div>

</body>
</html>
